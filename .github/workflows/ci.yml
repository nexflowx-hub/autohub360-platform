name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace-deps
            command: pnpm deps:check
          - name: lint
            command: pnpm lint
          - name: typecheck
            command: pnpm typecheck
          - name: build-tech
            command: pnpm build:tech
          - name: build-store
            command: pnpm build:store
          - name: build-admin
            command: pnpm --filter @autohub360/admin build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
